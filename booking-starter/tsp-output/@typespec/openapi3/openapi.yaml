openapi: 3.0.0
info:
  title: Call Booking API
  version: 0.0.0
tags:
  - name: Владелец
  - name: Гость
paths:
  /admin/bookings/upcoming:
    get:
      operationId: Admin_listUpcomingBookings
      description: |-
        Возвращает список предстоящих бронирований по всем типам событий.

        Ожидаемая сортировка: по startAt по возрастанию.
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
      tags:
        - Владелец
  /admin/event-types:
    post:
      operationId: Admin_createEventType
      description: |-
        Создаёт новый тип события.

        Тип события определяет название, описание и длительность будущих бронирований.
      parameters: []
      responses:
        "201":
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventType"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      tags:
        - Владелец
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventTypeRequest"
    get:
      operationId: Admin_listEventTypes
      description: Возвращает список всех типов событий, созданных владельцем календаря.
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventType"
      tags:
        - Владелец
  /admin/owner:
    get:
      operationId: Admin_getOwner
      description: Возвращает профиль единственного владельца календаря.
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
      tags:
        - Владелец
  /public/bookings:
    post:
      operationId: Public_createBooking
      description: |-
        Создаёт бронирование гостя.

        Правила:
        - гость не должен иметь аккаунт;
        - startAt должен попадать в окно записи на ближайшие 14 дней;
        - startAt должен соответствовать свободному слоту;
        - новое бронирование не должно пересекаться с существующими бронированиями;
        - конфликт проверяется по всем типам событий, а не только по выбранному eventTypeId.
      parameters: []
      responses:
        "201":
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      tags:
        - Гость
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
  /public/event-types:
    get:
      operationId: Public_listEventTypes
      description: |-
        Возвращает публичный список доступных типов событий.

        Используется на странице выбора вида брони.
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventType"
              examples:
                success:
                  summary: Два типа событий
                  value:
                    - id: 15-min
                      title: Встреча 15 минут
                      description: Короткий тип события для быстрого слота.
                      durationMinutes: 15
                    - id: 30-min
                      title: Встреча 30 минут
                      description: Базовый тип события для бронирования.
                      durationMinutes: 30
                empty:
                  summary: Пустой список
                  value: []
      tags:
        - Гость
  /public/event-types/{eventTypeId}:
    get:
      operationId: Public_getEventType
      description: |-
        Возвращает выбранный тип события.

        Используется перед отображением календаря свободных слотов.
      parameters:
        - name: eventTypeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventType"
              examples:
                default:
                  summary: Тип события 15 минут
                  value:
                    id: 15-min
                    title: Встреча 15 минут
                    description: Короткий тип события для быстрого слота.
                    durationMinutes: 15
        "404":
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      tags:
        - Гость
  /public/event-types/{eventTypeId}/slots:
    get:
      operationId: Public_listAvailableSlots
      description: |-
        Возвращает свободные слоты для выбранного типа события.

        Правила:
        - слоты формируются на ближайшие 14 дней, начиная с текущей даты;
        - возвращаются только свободные слоты;
        - занятость проверяется глобально по календарю владельца;
        - бронирования разных типов событий тоже конфликтуют между собой.
      parameters:
        - name: eventTypeId
          in: path
          required: true
          schema:
            type: string
