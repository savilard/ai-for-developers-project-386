components:
  schemas:
    AdminBookingListBody:
      type: object
      required:
        - bookings
        - summary
        - pagination
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        summary:
          $ref: "#/components/schemas/BookingSummary"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
      description: Тело ответа админского списка бронирований.
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          allOf:
            - $ref: "#/components/schemas/ErrorCode"
          description: Машиночитаемый код ошибки.
        message:
          type: string
          description: Человекочитаемое описание ошибки.
        details:
          type: array
          items:
            type: string
          description: Дополнительные детали ошибки.
      description: Унифицированная ошибка API.
    Booking:
      type: object
      required:
        - id
        - eventTypeId
        - eventTypeTitle
        - guest
        - startAt
        - endAt
        - status
        - createdAt
      properties:
        id:
          type: string
          description: Уникальный идентификатор бронирования.
        eventTypeId:
          type: string
          description: Идентификатор типа события.
        eventTypeTitle:
          type: string
          description: Название типа события на момент создания бронирования.
        guest:
          allOf:
            - $ref: "#/components/schemas/GuestContact"
          description: Контактные данные гостя.
        startAt:
          type: string
          format: date-time
          description: Время начала бронирования.
        endAt:
          type: string
          format: date-time
          description: |-
            Время окончания бронирования.

            Вычисляется по правилу:
            startAt + durationMinutes выбранного типа события.
        status:
          allOf:
            - $ref: "#/components/schemas/BookingStatus"
          description: Статус бронирования.
        createdAt:
          type: string
          format: date-time
          description: Дата и время создания бронирования.
      description: |-
        Бронирование времени гостем.

        Создаётся без регистрации и авторизации.
    BookingListResponse:
      type: object
      required:
        - bookings
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
    BookingStatus:
      type: string
      enum:
        - confirmed
        - pending
        - cancelled
      description: Статус бронирования.
    BookingSummary:
      type: object
      required:
        - total
        - confirmed
        - pending
        - cancelled
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
          description: Общее количество бронирований за выбранный период без учета фильтра status.
        confirmed:
          type: integer
          format: int32
          minimum: 0
          description: Количество подтвержденных бронирований за выбранный период.
        pending:
          type: integer
          format: int32
          minimum: 0
          description: Количество бронирований, ожидающих подтверждения, за выбранный период.
        cancelled:
          type: integer
          format: int32
          minimum: 0
          description: Количество отмененных бронирований за выбранный период.
      description: Сводная статистика бронирований за выбранный период.
    CreateBookingRequest:
      type: object
      required:
        - eventTypeId
        - startAt
        - guest
      properties:
        eventTypeId:
          type: string
          description: Идентификатор выбранного типа события.
        startAt:
          type: string
          format: date-time
          description: |-
            Выбранное гостем время начала бронирования.

            Значение должно соответствовать свободному слоту
            из окна записи на ближайшие 14 дней.
        guest:
          allOf:
            - $ref: "#/components/schemas/GuestContact"
          description: Контактные данные гостя.
      description: Запрос гостя на создание бронирования.
    CreateEventTypeRequest:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          minLength: 1
          description: |-
            Уникальный идентификатор типа события.

            Задаётся владельцем или админской частью системы.
        title:
          type: string
          minLength: 1
          description: Название типа события.
        description:
          type: string
          description: Описание типа события.
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          description: Длительность события в минутах.
      description: Запрос на создание типа события владельцем календаря.
    ErrorCode:
      type: string
      enum:
        - validation_error
        - not_found
        - slot_unavailable
        - booking_window_violation
        - conflict
      description: Код ошибки API.
    EventType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          description: Уникальный идентификатор типа события.
        title:
          type: string
          description: Название типа события, которое видит гость.
        description:
          type: string
          description: Описание типа события, которое видит гость.
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          description: |-
            Длительность события в минутах.

            Используется для расчёта времени окончания бронирования.
      description: |-
        Тип события, который создаёт владелец календаря.

        Например: "Знакомство", "Консультация", "Разбор проекта".
    GuestContact:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 1
          description: Имя гостя.
        email:
          type: string
          minLength: 1
          description: Email гостя.
        phone:
          type: string
          description: Необязательный телефон гостя.
      description: |-
        Контактные данные гостя.

        Гость не создаёт аккаунт и не проходит авторизацию.
        Эти данные используются только для создания бронирования.
    Owner:
      type: object
      required:
        - id
        - displayName
        - timezone
      properties:
        id:
          type: string
          description: Уникальный идентификатор владельца календаря.
        displayName:
          type: string
          description: Отображаемое имя владельца календаря.
        timezone:
          type: string
          description: |-
            Часовой пояс владельца календаря.

            Используется для расчёта доступных слотов и отображения времени.
      description: |-
        Единственный заранее заданный владелец календаря.

        В MVP нет регистрации и авторизации.
        Профиль владельца используется системой по умолчанию.
    PaginationMeta:
      type: object
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          description: Текущая страница, начиная с 1.
        pageSize:
          type: integer
          format: int32
          minimum: 1
          description: Количество элементов на странице.
        totalItems:
          type: integer
          format: int32
          minimum: 0
          description: Общее количество элементов после применения фильтров периода и status.
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: Общее количество страниц после применения фильтров периода и status.
      description: Метаданные серверной пагинации.
    Slot:
      type: object
      required:
        - eventTypeId
        - startAt
        - endAt
        - durationMinutes
      properties:
        eventTypeId:
          type: string
          description: Идентификатор типа события, для которого рассчитан слот.
        startAt:
          type: string
          format: date-time
          description: Время начала свободного слота.
        endAt:
          type: string
          format: date-time
          description: Время окончания свободного слота.
        durationMinutes:
          type: integer
          format: int32
          description: |-
            Длительность слота в минутах.

            Совпадает с длительностью выбранного типа события.
      description: |-
        Свободный слот для выбранного типа события.

        Слот является вычисляемой сущностью.
        Его не обязательно хранить в базе данных.
servers:
  - url: https://api.example.com
    description: Production API
    variables: {}
