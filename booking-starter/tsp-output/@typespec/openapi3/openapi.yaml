openapi: 3.0.0
info:
  title: Call Booking API
  version: 0.0.0
tags:
  - name: Владелец
  - name: Гость
paths:
  /admin/bookings/upcoming:
    get:
      operationId: Admin_listUpcomingBookings
      description: |-
        Возвращает список предстоящих бронирований по всем типам событий.

        Ожидаемая сортировка: по startAt по возрастанию.
      parameters:
        - name: from
          in: query
          required: false
          description: Начало периода фильтрации.
          schema:
            type: string
            format: date-time
          explode: false
        - name: to
          in: query
          required: false
          description: Конец периода фильтрации.
          schema:
            type: string
            format: date-time
          explode: false
        - name: status
          in: query
          required: false
          description: Статус бронирования для фильтрации таблицы.
          schema:
            $ref: "#/components/schemas/BookingStatus"
          explode: false
        - name: page
          in: query
          required: false
          description: Номер страницы, начиная с 1.
          schema:
            type: integer
            format: int32
            minimum: 1
          explode: false
        - name: pageSize
          in: query
          required: false
          description: Количество элементов на странице.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          explode: false
